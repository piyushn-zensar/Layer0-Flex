        : `<table class="dense"><thead><tr><th>Name</th><th>Category</th><th>Key features</th><th>Link</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>${p.products.filter((x) => x.active).map((x) => `<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.category)}</td><td><ul>${x.features.slice(0, 4).map((f) => `<li>${esc(f)}</li>`).join("")}</ul></td><td class="muted">-</td><td>${day(x.first_seen)}</td><td>${day(x.last_seen)}</td></tr>`).join("")}</tbody></table>`);
  }
  return `<div class="content">${pageHead("Product catalog", "Business units, their product families and models, the past responses used for matching, and the reference documents (sources) that back them.", "", 1)}${guide("catalog")}`
    + `<div class="filters" role="tablist" aria-label="Catalog view">${Object.entries(tabs).map(([t, l]) => `<button role="tab" aria-selected="${CAT.tab === t}" class="chip ${CAT.tab === t ? "on" : ""}" data-act="cattab" data-arg="${t}">${l}</button>`).join("")}</div>${body}</div>`;
}

const SCREENS = { portfolio: portfolioScreen, rfp: rfpScreen, trace: traceScreen, assessment: assessmentScreen, consolidation: consolidationScreen, outline: outlineScreen,
  decisions: decisionsScreen, changes: changesScreen, activity: activityScreen, inbox: inboxScreen, catalog: catalogScreen };

// ---------- router ----------
function route() {
  const [full, anchor] = (location.hash.slice(1) || "/portfolio").split("#"), [path, query] = full.split("?");
  const r = routeOf(path);
  return { ...r, query: new URLSearchParams(query ?? ""), anchor };
}
function routeOf(path) {
  let m;
  if ((m = path.match(/^\/opportunities\/([^/]+)(\/.*)?$/))) {
    const rest = m[2] ?? "";
    const name = { "": "rfp", "/trace": "trace", "/assessment": "assessment", "/consolidation": "consolidation", "/consolidation/activity": "activity",
      "/decisions": "decisions", "/changes": "changes", "/consolidation/outline": "outline" }[rest];
    return { path, name: m[1] === BID && name ? name : "missing", bid: true };
  }
  if ((m = path.match(/^\/inbox(?:\/([^/]+))?$/))) return { path, name: "inbox", bu: m[1] };
  if (path === "/catalog") return { path, name: "catalog" };
  return { path: "/portfolio", name: "portfolio" };
}

function render() {
  const r = route();
  if (r.name === "inbox" && !r.bu) { location.replace(`#/inbox/${me().bu ?? "BID"}`); return; }
  // keep the scroll of each pane and the focused field across a re-render
  const keep = {}; document.querySelectorAll("[data-keep]").forEach((el) => (keep[el.dataset.keep] = el.scrollTop));
  const f = document.activeElement, fid = f?.id, caret = fid && "selectionStart" in f ? [f.selectionStart, f.selectionEnd] : null;
  shell(r.path);
  const screen = SCREENS[r.name];
  const html = screen ? screen() : `<div class="content">${empty("Not in this demo", `This demo holds bid ${BID} only.`, `<div class="row" style="justify-content:center"><a class="button" href="#/portfolio">Back to Bids</a></div>`)}</div>`;
  $("#main").innerHTML = r.bid && r.name !== "missing" ? bidHead(r.path) + `<div class="content">${html}</div>` : html;
  document.querySelectorAll("[data-keep]").forEach((el) => { if (keep[el.dataset.keep] !== undefined) el.scrollTop = keep[el.dataset.keep]; });
  if (fid && document.getElementById(fid)) { const el = document.getElementById(fid); el.focus(); if (caret) try { el.setSelectionRange(...caret); } catch { /* number inputs */ } }
  if (T.scrollTo) { // the linked panes follow the selection
    for (const p of T.scrollTo.panes) { const pane = $(`[data-pane="${p}"]`), row = pane && pane.querySelector(`[data-req="${CSS.escape(T.scrollTo.req)}"]`);
      if (row) { const pr = pane.getBoundingClientRect(), rr = row.getBoundingClientRect(); if (rr.top < pr.top + 60 || rr.bottom > pr.bottom) pane.scrollTop += rr.top - pr.top - 80; } }
    const p1 = $('[data-pane="1"]'), box = p1 && p1.querySelector(".hl.sel"), page = p1 && p1.querySelector(".page img");
    const show = () => { const pr = p1.getBoundingClientRect(), br = box.getBoundingClientRect(); if (br.top < pr.top + 80 || br.bottom > pr.bottom) p1.scrollTop += br.top - pr.top - 120; };
    if (box && T.linked[1]) page.complete ? show() : page.addEventListener("load", show, { once: true }); // boxes have no height until the page image is in
    T.scrollTo = null;
  }
}

// ---------- events ----------
let toastSeq = 0;
function toast(text, kind = "info") {
  const id = "t" + ++toastSeq, box = $("#toasts");
  box.insertAdjacentHTML("beforeend", `<div class="toast ${kind}" id="${id}" role="status"><span class="toast-text">${esc(text)}</span><button type="button" class="alert-close" aria-label="Dismiss" data-close="${id}">×</button></div>`);
  setTimeout(() => document.getElementById(id)?.remove(), 4500);
}
const ACT = {
  move(arg) { const [p, dir] = arg.split(",").map(Number), i = T.order.indexOf(p), j = i + dir; if (j < 0 || j > 2) return; [T.order[i], T.order[j]] = [T.order[j], T.order[i]]; render(); },
  grip() { toast("Drag the panes by their grip in the app; here, use the ◀ ▶ arrows to change the order."); },
  link(p) { T.linked[p] = !T.linked[p]; if (T.linked[p] && T.sel) selectReq(T.sel); else render(); },
  enlarge(p) { p = Number(p); T.enlarged = T.enlarged === p ? null : p; T.scrollTo = { req: T.sel, panes: [2, 3] }; render(); },
  resetlayout() { T.order = [1, 2, 3]; T.widths = { ...DEFAULT_WIDTHS }; render(); },
  doc(id) { T.docId = id; T.page = 1; render(); },
  page(dir) { const n = traceDerived().pages.length; T.page = Math.min(n, Math.max(1, T.page + Number(dir))); render(); },
  clearfilters() { T.f = {}; render(); },
  regtab(t) { T.reg.tab = t; render(); }, regfilter(k) { T.reg.filter = k; render(); },
  expand(id) { T.reg.open.has(id) ? T.reg.open.delete(id) : T.reg.open.add(id); render(); },
  history(id) { T.reg.history = T.reg.history === id ? null : id; render(); },
  snap(n) { n = Number(n); T.reg.snap = T.reg.snap === n ? null : n; render(); },
  uncheck() { T.reg.checked.clear(); render(); },
  // compliance matrix
  mopen() { C.f.onlyOpen = !C.f.onlyOpen; C.limit = 100; render(); },
  mclear() { C.f = { ...NO_FILTER }; C.limit = 100; render(); },
  mmore() { C.limit += 100; render(); },
  mhist(key) { C.sel = key; C.history = true; C.srcPage = 0; render(); },
  mclose() { const k = C.sel; C.sel = null; C.source = false; render(); document.querySelector(`tr[data-mkey="${CSS.escape(k)}"]`)?.focus(); },
  msource() { C.source = !C.source; render(); },
  srcpage(i) { C.srcPage = Number(i); render(); },
  // activity, catalog
  actclear() { Object.assign(A, { entity: "", req_id: "", bu: "", person: "", shown: 200 }); render(); },
  actmore() { A.shown += 200; render(); },
  cattab(t) { CAT.tab = t; render(); },
  gate(k) { GATE[k] = !GATE[k]; render(); }, // a folded step opened again with "Change…", or closed with Cancel
};
const CHANGE = {
  pageno(_, el) { const n = traceDerived().pages.length; T.page = Math.min(n, Math.max(1, Number(el.value) || 1)); render(); },
  filter(k, el) { T.f[k] = el.value || undefined; render(); },
  regq(_, el) { T.reg.q = el.value; render(); },
  check(id, el) { el.checked ? T.reg.checked.add(id) : T.reg.checked.delete(id); render(); },
  checkall(_, el) { T.reg.checked = el.checked ? new Set(T.reg.selectable ?? []) : new Set(); render(); },
  mf(k, el) { C.f[k] = el.value; C.limit = 100; render(); },
  act(k, el) { A[k] = el.value; A.shown = 200; render(); },
};
document.addEventListener("click", (e) => {
  const t = e.target;
  const close = t.closest("[data-close]"); if (close) { document.getElementById(close.dataset.close)?.remove(); return; }
  const demo = t.closest("[data-demo]");
  if (demo) { e.preventDefault(); if (!demo.disabled) toast(`Demo: not saved. ${demo.dataset.demo} works in the live app.`); return; }
  const act = t.closest("[data-act]");
  if (act && act.tagName !== "FORM") { e.preventDefault(); ACT[act.dataset.act]?.(act.dataset.arg, act); return; }
  const hl = t.closest("[data-hl]"); if (hl) { selectReq(hl.dataset.hl, { from: 1 }); return; }
  if (t.closest("button, a, input, select, textarea, summary, details, label")) return;
  const row = t.closest("[data-req]"); if (row) selectReq(row.dataset.req, { from: Number(row.dataset.from) });
  const mrow = t.closest("[data-mkey]"); if (mrow) { C.sel = mrow.dataset.mkey; C.history = false; C.srcPage = 0; render(); }
});
// the matrix detail's history: remember whether it is open across re-renders
document.addEventListener("toggle", (e) => { if (e.target.dataset?.toggle === "mhistory" && C.history !== e.target.open) { C.history = e.target.open; render(); } }, true);
// the compliance reason: a tooltip that is never clipped by the table's scroll (ComplianceBadge.tsx)
const tip = (on) => (e) => { const t = e.target.closest?.(".reason-tip"); if (!t) return; const pop = t.querySelector(".reason-pop");
  if (!on) { pop.classList.remove("on"); pop.style.left = pop.style.top = ""; return; }
  const b = t.getBoundingClientRect(); pop.style.left = `${Math.max(8, Math.min(b.left, window.innerWidth - 320))}px`; pop.style.top = `${b.bottom + 6}px`; pop.classList.add("on"); };
document.addEventListener("mouseover", tip(true)); document.addEventListener("mouseout", tip(false));
document.addEventListener("focusin", tip(true)); document.addEventListener("focusout", tip(false));
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.matches?.("[data-mkey]")) { e.preventDefault(); C.sel = t.dataset.mkey; C.history = false; render(); return; }
  if (e.key === "Escape" && C.sel && route().name === "consolidation") { ACT.mclose(); return; }
  if ((e.key === "Enter" || e.key === " ") && t.matches?.("[data-req], [data-hl]")) { e.preventDefault(); selectReq(t.dataset.req ?? t.dataset.hl, { from: Number(t.dataset.from) || 1 }); }
  if (e.key === "Escape" && T.enlarged !== null) { T.enlarged = null; render(); }
});
// text fields re-render as you type; selects and numbers on change
document.addEventListener("input", (e) => { const el = e.target; if (el.dataset?.change && el.type === "search") CHANGE[el.dataset.change](el.dataset.arg, el); });
document.addEventListener("change", (e) => { const el = e.target; if (el.dataset?.change && el.type !== "search") CHANGE[el.dataset.change](el.dataset.arg, el); });
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.act === "search") { searched = true; render(); }
  else if (e.target.dataset.act === "actreq") { A.req_id = $("#actreq").value.trim(); A.shown = 200; render(); }
  else if (e.target.dataset.demoForm) toast(`Demo: not saved. ${e.target.dataset.demoForm} works in the live app.`);
});
// the bars between panes: drag to resize the two neighbours (layout.ts resizePair, simplified)
document.addEventListener("pointerdown", (e) => {
  const bar = e.target.closest?.("[data-split]"); if (!bar || e.button !== 0) return;
  const [l, r] = bar.dataset.split.split(",").map(Number), lw = $(`[data-pane="${l}"]`).offsetWidth, rw = $(`[data-pane="${r}"]`).offsetWidth;
  const x0 = e.clientX, pair = T.widths[l] + T.widths[r], grid = bar.parentElement;
  bar.setPointerCapture(e.pointerId); bar.classList.add("active"); e.preventDefault();
  const move = (ev) => { const nl = Math.min(lw + rw - 240, Math.max(240, lw + ev.clientX - x0));
    T.widths[l] = pair * nl / (lw + rw); T.widths[r] = pair - T.widths[l];
    grid.style.setProperty("--ws-cols", T.order.map((p) => `minmax(240px, ${T.widths[p]}fr)`).join(" 10px ")); };
  const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); render(); };
  bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up);
});

// ---------- controls: role picker, guidance ----------
(function controls() {
  const groups = [["Bid desk", ACCOUNTS.filter((a) => a.role === "bid_manager")],
    ...[...new Set(ACCOUNTS.filter((a) => a.bu).map((a) => a.bu))].map((bu) => [unitName(bu), ACCOUNTS.filter((a) => a.bu === bu)])];
  $("#role").innerHTML = groups.map(([label, list]) => `<optgroup label="${esc(label)}">${list.map((a) => `<option value="${esc(a.username)}"${attr("selected", a.username === user)}>${esc(a.me.role_label)} · ${esc(a.bu ?? "Bid desk")}</option>`).join("")}</optgroup>`).join("");
  $("#role").addEventListener("change", (e) => {
    user = e.target.value; store.set("user", user);
    const home = `#/inbox/${me().bu ?? "BID"}`;
    if (route().name === "inbox" && location.hash !== home) location.hash = home; else render();
    toast(`Now viewing as ${me().name} (${me().role_label}).`);
  });
  const g = $("#guide");
  const setGuide = (on) => { document.body.classList.toggle("guide-on", on); g.setAttribute("aria-pressed", String(on)); g.textContent = on ? "Hide guidance" : "Show guidance"; store.set("guide", on ? "1" : "0"); };
  g.addEventListener("click", () => setGuide(!document.body.classList.contains("guide-on")));
  setGuide(store.get("guide") === "1");
  $("#stamp").textContent = `Demo · ${BID} · recorded ${formatDate(D.meta.generated_at)}`;
})();
function applyLink() {
  const r = route();
  if (r.name === "trace") {
    const f = {}; for (const k of [...FACETS, "from", "to", "q", "sort"]) if (r.query.get(k)) f[k] = r.query.get(k);
    if (r.query.toString() || r.anchor) T.f = f; // a link sets the filters it carries, as the app's URL does
    if (r.anchor && D.trace.rows.some((x) => x.req.req_id === r.anchor)) { selectReq(r.anchor); return; }
  }
  if (r.name === "activity") { A.req_id = r.query.get("req_id") ?? ""; A.shown = 200; }
  render();
}
let lastScreen = route().name;
window.addEventListener("hashchange", () => {
  const name = route().name;
  if (name !== lastScreen) { Object.assign(C, { sel: null, source: false, history: false }); for (const k in GATE) delete GATE[k]; } // leaving a page resets its panels, as the app does
  lastScreen = name; window.scrollTo(0, 0); applyLink();
});
applyLink();
</script>
