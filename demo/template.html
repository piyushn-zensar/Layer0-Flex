<!doctype html>
<!-- P-51: the static Layer 0 demo. scripts/export_demo_html.py fills the CSS (web/app/*.css, copied at export) and the
     recorded data (one JSON blob). Everything is inline: no network, opens from file://. Read-only: actions show a toast. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer 0 Demo</title>
<style>
/*__APP_CSS__*/
/* ---- demo only ---- */
.demo-ctl { display: flex; align-items: center; gap: var(--s2); }
.demo-ctl select { min-height: 28px; padding: 3px 6px; font-size: var(--fs-sm); max-width: 250px; }
.demo-guide { display: none; }
body.guide-on .demo-guide { display: flex; }
.demo-guide .alert-title::before { content: "ⓘ "; }
.demo-stamp { color: var(--nav-ink); font-size: var(--fs-xs); white-space: nowrap; }
.ws-split { touch-action: none; }
a.chip { display: inline-flex; white-space: nowrap; margin: 2px 0; }
@media (max-width: 1100px) { .topbar-right { flex-wrap: wrap; } .demo-stamp { display: none; } }
@media (max-width: 640px) { .page-actions { flex-wrap: wrap; } .page-actions .button { white-space: normal; } .matrix-filters label, .matrix-filters select { min-width: 0; max-width: 100%; }
  .topbar { flex-wrap: wrap; } .portfolio td:nth-child(2) { min-width: 160px; }
  .topbar-right > .actor { flex: 1 1 100%; } .demo-ctl { flex: 1 1 100%; min-width: 0; } .demo-ctl label { flex: 1 1 auto; min-width: 0; } .demo-ctl select { max-width: 100%; width: 100%; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/portfolio"><span class="brand-mark" aria-hidden="true">L0</span>Layer 0 <span class="brand-sub">Bid workflow</span></a>
  <nav class="topnav" aria-label="Main" id="topnav"></nav>
  <div class="topbar-right">
    <a class="button" href="#" data-demo="Creating a bid" id="newbid">New bid</a>
    <div class="actor"><div class="actor-id" aria-live="polite" id="actor"></div></div>
    <div class="demo-ctl">
      <label><span class="sr-only">View as</span><select id="role" title="Whose view to show (no sign-in in the demo)"></select></label>
      <button type="button" class="secondary sm" id="guide" aria-pressed="false">Show guidance</button>
    </div>
    <span class="demo-stamp" id="stamp"></span>
  </div>
</header>
<main id="main"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="application/json" id="demo-data">__DEMO_DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("demo-data").textContent);
const BID = D.meta.bid;
const $ = (s, el = document) => el.querySelector(s);
const store = { get(k) { try { return localStorage.getItem("layer0.demo." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("layer0.demo." + k, v); } catch { /* private window: per-visit only */ } } };

// ---------- labels (web/lib/types.ts, web/components/ui/StatusBadge.tsx) ----------
const TONES = { proposed: "pending", approved: "ok", accepted: "ok", rejected: "neutral", merged: "neutral", split: "neutral", duplicate: "neutral",
  review: "pending", applied: "ok", discarded: "neutral", queued: "pending", confirmed: "ok",
  assigned: "pending", submitted: "info", validated: "ok", returned: "bad", withdrawn: "neutral", blocked: "bad",
  new: "neutral", reading: "pending", frozen: "info", go: "info", no_go: "bad", dispatched: "info", consolidating: "info",
  uploaded: "pending", ingesting: "pending", ingested: "ok", failed: "bad", active: "ok",
  high: "bad", medium: "pending", low: "neutral", pass: "ok", warn: "pending", fail: "bad", "n/a": "neutral",
  answered: "ok", pending: "pending", over: "bad",
  CTO: "ok", SEMI_CUSTOM: "pending", ETO: "bad", NONE: "neutral",
  met: "ok", partial: "pending", partially_met: "pending", not_met: "bad", deviation: "info", exception: "info", unknown: "neutral",
  added: "ok", modified: "pending", removed: "bad", unchanged: "neutral", not_a_requirement: "neutral" };
const OFFERING = { SEMI_CUSTOM: "Semi-custom", NONE: "Bid desk" };
const offeringLabel = (s) => OFFERING[String(s ?? "NONE")] ?? String(s ?? "NONE");
// the meaning of each type of offer, as the Traceability legend states it (a badge's tooltip on every screen)
const OFFERING_MEANING = { CTO: "Configure-to-order: catalog product with options (CPQ)", SEMI_CUSTOM: "Semi-custom: configured product plus workshop work for this customer",
  ETO: "Engineered-to-order: designed for this requirement", NONE: "Bid desk: not a product item" };
const toneOf = (status, kind = "status") => { const s = String(status ?? "").trim().replace(/[\s-]+/g, "_");
  return (kind === "opp" && s === "submitted" && "ok") || TONES[s] || TONES[s.toLowerCase()] || "neutral"; };
const DOC_TYPES = { main: "Main RFP", addendum: "Addendum", qa: "Clarification / Q&A", change: "Change request", other: "Other" };
const COMPLIANCE_LABELS = { met: "Compliant", partial: "Partially compliant", deviation: "Compliant with changes", not_met: "Non-compliant" };
const complianceLabel = (c) => (c ? COMPLIANCE_LABELS[c] ?? c.replace(/_/g, " ") : "");
const sourceLabel = (p) => (p === "EXTRACTED" ? "Source verified" : "Source not verified");
const ORIGIN_LABELS = { extraction: "Read from the RFP", correction: "Correction", customer_change: "Customer change" };
const originLabel = (o) => (o ? ORIGIN_LABELS[o] ?? o.replace(/_/g, " ") : "");
const COVERAGE_LABELS = { pages: "pages", pages_read: "pages read", pages_failed: "pages the reader failed on", pages_skipped: "pages skipped (contents, blank)",
  pages_unreadable: "pages not readable", chunks: "reader calls", chunks_failed: "reader calls failed", candidates: "candidates", admitted: "in the register",
  exceptions: "need a source check", duplicates: "duplicates", groups: "groups", problems: "problems" };
const coverageLabel = (k) => COVERAGE_LABELS[k] ?? k.replace(/_/g, " ");
const STATUS_LABELS = { approved: "In register", rejected: "Excluded: not a requirement", exception: "Needs a source check", dismissed: "Dismissed",
  duplicate: "Duplicate", proposed: "Proposed", split: "Split", merged: "Merged", removed: "Removed", uploaded: "Uploaded", ingesting: "Reading", ingested: "Read" };
const statusLabel = (s) => STATUS_LABELS[s] ?? s.replace(/_/g, " ");
const OPP_STATUS_LABELS = { new: "New", reading: "Reading the RFP", review: "In review", frozen: "Requirements frozen", go: "Go", no_go: "No-go",
  dispatched: "Sent to units", consolidating: "Go: response in preparation", submitted: "Submitted" };
const oppStatusLabel = (s) => OPP_STATUS_LABELS[s] ?? s.replace(/_/g, " ");
// the bid's one status badge where a go/no-go is recorded (types.ts bidStatus)
const bidStatus = (status, decision) => decision === "no_go" ? { status: "no_go", label: "No-go recorded" }
  : decision === "go" && !["consolidating", "submitted"].includes(status) ? { status: "go", label: "Go recorded" } : { status, label: oppStatusLabel(status) };
const categoryLabel = (c) => (c ? c.charAt(0).toUpperCase() + c.slice(1).replace(/_/g, " ") : c);
const snapshotName = (n) => `RFP reading ${n}`;
const readSummary = (c, requirements) => `${c.candidates ?? 0} statements read`
  + (requirements !== undefined ? `, grouped into ${requirements} requirements` : `, ${c.admitted ?? 0} in the register`)
  + (c.groups ? ` (${c.groups} groups)` : "") + (c.exceptions ? `; ${c.exceptions} need a source check` : "") + (c.duplicates ? `; ${c.duplicates} duplicates` : "") + ".";
// one date format on every screen: "13 Nov 2026", with the time "13 Nov 2026, 19:01" (a timestamp without a zone is UTC)
const formatDate = (t, time = false) => { if (!t) return "";
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(t) ? `${t}T00:00:00` : /(Z|[+-]\d{2}:?\d{2})$/.test(t) ? t : `${t}Z`);
  return d.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", ...(time ? { hour: "2-digit", minute: "2-digit" } : {}) }); };
const TERMS = { assessment: "Assessment Summary", offering_type: "Type of offer", exception: "Needs a source check", solution: "Proposed solution",
  solution_area: "Solution area", solution_pending: "solution to be set by the unit's designer / engineer", capability_gap: "Capability gap: not offered" };
const solutionLabel = (s) => (s.area ? `${s.unit} · ${s.area}` : s.unit);
const examplesLabel = (s) => (s.examples.length ? `For example: ${s.examples.join(", ")}` : "");
const KB_STATE = { queued: "Waiting for review", approved: "Reviewed example", retired: "Replaced by a newer version" };

// ---------- tiny view helpers ----------
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const attr = (name, v) => (v === undefined || v === null || v === false ? "" : v === true ? ` ${name}` : ` ${name}="${esc(v)}"`);
const badge = (status, { kind = "status", label, cls = "", title } = {}) => {
  const plain = String(status ?? "unknown").replace(/_/g, " ");
  const text = label ?? (kind === "offering" ? offeringLabel(status) : plain.charAt(0).toUpperCase() + plain.slice(1));
  const tip = title ?? (kind === "offering" ? OFFERING_MEANING[String(status ?? "NONE")] : undefined);
  return `<span class="${`badge t-${toneOf(status, kind)} ${cls}`.trim()}"${attr("title", tip)}>${esc(text)}</span>`;
};
const when = (t) => formatDate(t, true);
const pageHead = (title, help, actions = "", level = 2) => `<div class="page-head"><div><h${level} class="page-title">${esc(title)}</h${level}>`
  + (help ? `<p class="page-help">${esc(help)}</p>` : "") + `</div>${actions ? `<div class="page-actions">${actions}</div>` : ""}</div>`;
const alertBox = (kind, body, title) => `<div class="alert ${kind}" role="${kind === "error" || kind === "warn" ? "alert" : "status"}"><div class="alert-body">`
  + (title ? `<span class="alert-title">${esc(title)}</span>` : "") + `${body}</div></div>`;
const empty = (title, hint, extra = "") => `<div class="empty"><div class="empty-title">${esc(title)}</div>${hint ? `<p>${esc(hint)}</p>` : ""}${extra}</div>`;
// data-demo: an action that writes in the real app; the demo shows a toast instead
const demoBtn = (label, { cls = "", disabled = false, title, what } = {}) =>
  `<button type="button"${attr("class", cls || undefined)}${attr("disabled", disabled)}${attr("title", title)} data-demo="${esc(what || label)}">${esc(label)}</button>`;

// ---------- who is viewing ----------
const ACCOUNTS = D.accounts;
const unitName = (code) => (D.unit_names.find((u) => u.code === code) ?? {}).name ?? code;
let user = ACCOUNTS.some((a) => a.username === store.get("user")) ? store.get("user") : "bid.manager";
const me = () => ACCOUNTS.find((a) => a.username === user).me;
const isBM = () => me().role === "bid_manager";

// ---------- guidance (Show guidance) ----------
const PLACEHOLDER = "The units' answers in this demo are illustrative placeholder responses, not offers.";
const GUIDE = {
  portfolio: "The list of bids. This demo holds one: the RC-1 AI campus, a synthetic request for proposal covering the power and cooling chain from the grid connection to the chip, taken through the whole workflow. Its status shows that the go decision is recorded and the response is being prepared; the bars show, per business unit, how many of its answers are validated. Open the bid to follow its steps. " + PLACEHOLDER,
  rfp: "Step 1. The customer's RFP was uploaded here and read automatically: each statement became a requirement tied to its page and lines, and related statements were grouped under one requirement. The coverage card shows that every page and every statement is accounted for. The search box finds passages in plain words; the demo shows one recorded search.",
  trace: "Step 2. Three panes side by side: the RFP page (1), the requirement register (2) and the proposed solution with the units' answers (3). Select a requirement in any pane and the others follow: its source lines are highlighted on the page and its proposed solution and answers come into view. The filters above narrow panes 2 and 3.",
  pane1: "The boxes show where each requirement was quoted from; the orange box is the selected one. Click a box to select its requirement; use the arrows to turn the pages.",
  pane2: "The requirement register. It was frozen when the RFP was read; every correction since then (an edit, a split, a merge, an exclusion, a missed requirement) was saved with a reason as a new frozen version. A group holds a requirement and its sub-requirements: expand it to see them. History shows who changed what.",
  pane3: "For each requirement: the proposed solution (business unit and solution area, with example products), the type of offer and an example bill of materials, then each unit's answer and compliance. Product requirements that no participating unit offers are marked as capability gaps: not offered. " + PLACEHOLDER,
  assessment: "Step 3. The bid manager reviews what the bid is about, chooses the business units that take part, routes each requirement to a team and sends the work out. In this final state every step is done: the recorded choices are shown and the forms are folded away (the bid manager can reopen them with the Change buttons; other roles only see what was recorded).",
  score: "Three separate measures, never a probability: how many technical requirements the system first matched to a participating unit's solution; how many the units' design engineers reviewed (confirmed as proposed, or corrected with another solution or a compliance answer other than Compliant); and how many requirements sent to the units have all their answers validated. Standards and regulatory items are listed beside them, not counted.",
  open_questions: "What needed attention before the response: requirements without an owner, requirements whose source could not be verified, engineering rule warnings and questions from the units. Rule warnings the bid manager checked at the bid decision are shown as checked.",
  participation: "The business units the bid manager chose to take part, with the reason. Only these units received work.",
  routing: "Each requirement goes to one team: a business unit, or the bid desk for commercial and submission items. Product requirements that no participating unit can offer are recorded as capability gaps and stated in the response as not offered.",
  schedule: "Each unit manager gave the unit's finish date and said whether people, skills, manufacturing capacity, materials or cost limit delivery. The planned submission date is the latest unit date plus the days needed to assemble the response. The bid manager accepted these estimates and did not set the dates.",
  compliance_position: "Per unit: how many validated answers are compliant, partially compliant, compliant with changes or non-compliant. The bid desk row holds the capability gaps. The bid manager approved this position.",
  consolidation: "Step 4. One row per requirement and unit answer: the response to the customer is built from these. Every requirement is answered and validated. Select a row to see the full answer, its history and the highlighted source in the RFP. " + PLACEHOLDER,
  outline: "A first draft of the written response, built only from validated answers; each paragraph cites the requirements it rests on, and the points still to add or confirm are listed. It is a starting point for the bid manager to edit before anything goes to the customer.",
  decisions: "Step 5. The evidence for the go / no-go: engineering checks, workload, the compliance position and the decision criteria. Layer 0 gives its assessment of each criterion; the bid manager made the call and recorded the reasons, shown at the bottom of the page.",
  engineering: "Automatic checks over the requirements: which parts of the grid-to-chip chain the RFP covers, and simple engineering rules. They are evidence for the bid manager, never a decision; the rules and capacities are illustrative.",
  gonogo: "Layer 0's assessment of each criterion next to the bid manager's judgement, and the decision recorded for this bid. The bid manager can reopen it with Change decision.",
  activity: "Everything recorded for this bid, newest first: who did what and when. Nothing here can be changed. Filter by type, requirement, unit or person. The demo workflow was run in one sitting, so many steps carry nearly the same time.",
  changes: "Addenda, Q&A answers and change requests are read like the RFP and compared with the frozen requirements; a person confirms each change, and applying it returns the affected answers to their units.",
  inbox: "One work package: the requirements assigned to a business unit or to the bid desk. Designers / engineers answer the technical items; unit managers answer the other items and validate the technical answers; the bid manager validates the rest and can return any answer with a question. Switch the role at the top to see each person's view. " + PLACEHOLDER,
  completion: "Only the unit manager sees this: the unit's finish date for the bid and the five delivery factors.",
  catalog: "The business units, their product families and published models from which solutions are proposed, and the reference documents behind them. Models are examples taken from public Flex web pages.",
};
const guide = (key, extra = "") => GUIDE[key] ? `<div class="alert info demo-guide" role="note"><div class="alert-body"><span class="alert-title">Guidance</span>${esc(GUIDE[key] + (extra ? " " + extra : ""))}</div></div>` : "";
// ---------- page images: base64 data URIs turned into blob URLs once ----------
const blobs = {};
function img(doc, n) {
  const k = `${doc}/${n}`;
  if (!blobs[k] && D.images[k]) {
    const [head, b64] = D.images[k].split(","), bin = atob(b64), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    blobs[k] = URL.createObjectURL(new Blob([a], { type: head.slice(5, head.indexOf(";")) }));
  }
  return blobs[k] ?? "";
}

// ---------- shell ----------
const opp = () => D.bid.detail.opportunity;
const STEPS = [
  { suffix: "", label: "RFP", doneFrom: "reading" },
  { suffix: "/trace", label: "Requirement Traceability", doneFrom: "frozen" },
  { suffix: "/assessment", label: TERMS.assessment, doneFrom: "dispatched" },
  { suffix: "/consolidation", label: "Compliance matrix", doneFrom: "submitted" },
  { suffix: "/decisions", label: "Bid decision", doneFrom: "submitted" },
];
const ORDER = ["new", "reading", "review", "frozen", "go", "no_go", "dispatched", "consolidating", "submitted"];
const rank = (s) => (s === "no_go" ? ORDER.indexOf("go") : ORDER.indexOf(s));

function bidHead(path) {
  const base = `/opportunities/${BID}`, status = opp().status, decided = !!D.bid.decisions.go_no_go;
  const onChanges = path === base + "/changes", onActivity = path === base + "/consolidation/activity";
  const steps = STEPS.map((s, i) => {
    const current = !(s.suffix === "/consolidation" && onActivity) && (path === base + s.suffix || (s.suffix !== "" && path.startsWith(base + s.suffix + "/")));
    const done = rank(status) >= rank(s.doneFrom) || (s.doneFrom === "submitted" && decided);
    return `<li class="${current ? "current" : ""} ${done ? "done" : ""}"><a href="#${base + s.suffix}"${attr("aria-current", current && "step")}${attr("title", done && `${s.label}: done`)}>`
      + `<span class="step-no" aria-hidden="true">${done ? "✓" : i + 1}</span>${esc(s.label)}${done ? '<span class="sr-only"> (done)</span>' : ""}</a></li>`;
  }).join("");
  return `<div class="opp-head"><div class="opp-title"><nav class="crumbs" aria-label="Breadcrumb"><a href="#/portfolio">Bids</a><span aria-hidden="true">›</span><span class="mono">${esc(BID)}</span></nav>`
    + `<h1>${esc(opp().title)} <span>${(({ status: st, label }) => badge(st, { kind: "opp", cls: "opp-status lg", label }))(bidStatus(status, D.bid.decisions.go_no_go?.outcome))}</span></h1></div>`
    + `<nav aria-label="Workflow steps"><ol class="stepper">${steps}</ol><div class="step-side">`
    + `<a class="step-later ${onChanges ? "current" : ""}" href="#${base}/changes"${attr("aria-current", onChanges && "page")}><span class="step-no" aria-hidden="true">Δ</span>Changes</a>`
    + `<a class="step-later ${onActivity ? "current" : ""}" href="#${base}/consolidation/activity"${attr("aria-current", onActivity && "page")}><span class="step-no" aria-hidden="true">≡</span>Activity</a>`
    + `</div></nav></div>`;
}

function shell(path) {
  const links = [["#/portfolio", "Bids", ["/portfolio", "/opportunities/"]], ["#/inbox", "My work", ["/inbox"]], ["#/catalog", "Product catalog", ["/catalog"]]];
  $("#topnav").innerHTML = links.map(([href, label, m]) => { const on = m.some((x) => path.startsWith(x));
    return `<a href="${href}"${attr("class", on && "active")}${attr("aria-current", on && "page")}>${label}</a>`; }).join("");
  const m = me();
  $("#actor").innerHTML = `<strong>${esc(m.name)}</strong><span>${esc(m.role_label)}${m.bu ? ` · ${esc(m.bu)}` : ""}</span>`;
  $("#newbid").style.display = isBM() ? "" : "none"; // only the bid manager starts a bid (.button sets display, so not [hidden])
}

// ---------- screens ----------
function portfolioScreen() {
  const rows = D.portfolio.map(({ opp: o, requirements, progress, decision }) => {
    const units = Object.entries(progress), st = bidStatus(o.status, decision);
    const up = units.length === 0 ? '<span class="muted">Not sent to units</span>' :`<div class="unit-progress">${units.map(([bu, p]) => {
      const waiting = p.submitted - p.validated, note = `${p.validated} validated, ${waiting} awaiting validation, ${p.total - p.submitted} not answered`;
      const pct = (n) => `${p.total ? (n / p.total) * 100 : 0}%`;
      return `<div class="unit-row" title="${esc(note)}"><a href="#/inbox/${esc(bu)}" aria-label="${esc(`${bu} work package: ${note}`)}">${esc(bu)}</a>`
        + `<span class="unit-count">${p.validated}/${p.total} validated</span><span class="unit-bar" aria-hidden="true">`
        + `<span class="done" style="width:${pct(p.validated)}"></span><span class="wait" style="width:${pct(waiting)}"></span></span></div>`; }).join("")}</div>`;
    return `<tr><td class="mono"><a href="#/opportunities/${esc(o.id)}">${esc(o.id)}</a></td>`
      + `<td><a href="#/opportunities/${esc(o.id)}/trace" class="portfolio-title">${esc(o.title)}</a></td>`
      + `<td>${o.customer ? esc(o.customer) : '<span class="muted">not set</span>'}</td>`
      + `<td>${badge(st.status, { kind: "opp", label: st.label })}</td><td class="num">${requirements}</td><td>${up}</td>`
      + `<td><a class="button secondary sm" href="#/opportunities/${esc(o.id)}/trace" aria-label="Open ${esc(o.id)}">Open</a></td></tr>`;
  }).join("");
  return `<div class="content">${pageHead("Bids", "Every bid in progress, with how far each business unit has answered.", "", 1)}`
    + guide("portfolio")
    + `<table class="portfolio"><thead><tr><th>ID</th><th>Title</th><th>Customer</th><th>Status</th><th class="num">Requirements</th><th>Unit responses (validated / total)</th><th scope="col" aria-label="Open"></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

let searched = false;
function rfpScreen() {
  const o = opp(), docs = D.bid.detail.documents, snaps = D.bid.extraction, status = o.status;
  const canRead = status === "new" || status === "review", started = !canRead, bm = isBM();
  const read = docs.some((d) => d.role === "main" && d.status === "ingested");
  const views = (D.samples?.samples ?? []).find((s) => docs.some((d) => d.role === "main" && d.filename === s.filename))?.views ?? [];
  const table = `<table class="docs"><thead><tr><th>File</th><th>Document type</th><th class="num">Pages</th><th>Status</th><th>Received</th></tr></thead><tbody>`
    + docs.map((d) => `<tr><td>${esc(d.filename)}</td><td>${esc(DOC_TYPES[d.role] ?? d.role)}</td><td class="num">${d.page_count}</td><td>${badge(d.status, { label: statusLabel(d.status) })}</td>`
      + `<td title="SHA-256 ${esc(d.sha256)}">${esc(formatDate(d.received_at, true)) || `<span class="mono">${esc(d.sha256.slice(0, 12))}</span>`}</td></tr>`).join("")
    + (docs.length ? "" : '<tr><td colspan="5" class="muted">No documents yet. Upload the RFP below.</td></tr>') + "</tbody></table>";
  const form = `<form class="${started ? "form" : "card form"}" data-demo-form="Uploading a document">`
    + `<label>RFP file (PDF, Word or Excel) <input type="file" name="file" disabled></label>`
    + `<label>Document type <select name="role">${Object.entries(DOC_TYPES).map(([v, l]) => `<option value="${v}"${attr("selected", v === (started ? "addendum" : "main"))}>${esc(l)}</option>`).join("")}</select></label>`
    + demoBtn("Upload and read", { disabled: !bm, title: bm ? undefined : BM_ONLY }) + demoBtn("Refresh status", { cls: "secondary" }) + `</form>`;
  const s = D.bid.search;
  const search = read ? `<section class="card"><div class="card-head"><h2>Search this RFP</h2><span class="muted">Ask in plain words; the best passages come back with page and lines.</span></div>`
    + `<form class="inline rfp-search" role="search" data-act="search"><label><span class="sr-only">Question</span><input type="search" name="q" value="${esc(s.q)}" placeholder="e.g. what short-circuit rating is required?" class="wide"></label><button>Search</button></form>`
    + (searched ? `<div><p class="muted">${s.mode === "embeddings" ? "Meaning-based search" : "Keyword search (no embedding service: offline)"} over the RFP's passages. <em>Demo: the recorded answer to “${esc(s.q)}”.</em></p><ol class="passages">`

      + (s.passages.length ? "" : '<li class="muted">Nothing found.</li>') + "</ol></div>" : "") + "</section>" : "";
  const c = snaps[0]?.coverage, n = D.portfolio.find((x) => x.opp.id === BID)?.requirements;
  const sum = (total, parts) => `${c[total]} ${coverageLabel(total)} = ` + parts.map((k) => `${c[k] ?? 0} ${coverageLabel(k)}`).join(" + ");
  const coverage = c ? `<section class="card"><div class="card-head"><h2>What the reader covered</h2><span class="muted">${snapshotName(snaps[0].number)}</span></div>`
    + ("pages_read" in c ? `<p>${esc(sum("pages", ["pages_read", "pages_failed", "pages_skipped", "pages_unreadable"]))}${c.chunks_failed ? ` (${c.chunks_failed} of ${c.chunks} ${coverageLabel("chunks")} failed)` : ""}</p>` : `<p class="muted">${c.pages} pages (read before page coverage was recorded)</p>`)

    + guide("rfp")
    + (views.length ? `<p>Focus: ${views.map((v) => `<a href="#/opportunities/${BID}/trace?${esc(v.query)}">${esc(v.label)}</a>`).join(" · ")}</p>` : "")
    + table
    + (started ? `<details class="card"><summary><strong>Add another document</strong> <span class="muted">(addendum, clarification / Q&amp;A, change request)</span></summary>${form}</details>` : form)
    + search + coverage
    + (started ? '<p class="muted">Requirement review has started, so the RFP is not re-read. Missed items can be added in pane 2 of Requirement Traceability.</p>'
      : `<div class="row">${demoBtn("Run the reader agent → requirements", { disabled: !bm, title: bm ? undefined : BM_ONLY })}${bm ? "" : '<span class="muted">Only the bid manager uploads documents and runs the reader.</span>'}</div>`);
}
// ---------- Requirement Traceability ----------
const PANE_NAMES = { 1: "Original RFP", 2: "Requirement register", 3: "Proposed solution and responses" };
const DEFAULT_WIDTHS = { 1: 1, 2: 1, 3: 1.3 };
const T = { sel: null, docId: null, page: 1, linked: { 1: true, 2: true, 3: true }, enlarged: null, order: [1, 2, 3], widths: { ...DEFAULT_WIDTHS },
  f: {}, reg: { tab: "register", filter: "register", q: "", open: new Set(), history: null, checked: new Set() }, scrollTo: null };
const isDefaultLayout = () => T.order.join() === "1,2,3" && [1, 2, 3].every((p) => T.widths[p] === DEFAULT_WIDTHS[p]);

// filters.ts (A-27), ported as is
const SORTS = { id: "ID", category: "Category", unit: "Unit", compliance: "Compliance", changed: "Last change" };
const RESPONSES = { not_sent: "Not sent", assigned: "Assigned", submitted: "Submitted", returned: "Returned", validated: "Validated" };
const FACETS = ["category", "offering", "unit", "response", "compliance", "source", "origin"];
const FACET_LABELS = {
  category: ["Category", {}],
  offering: [TERMS.offering_type, { CTO: "CTO (configure to order)", SEMI_CUSTOM: "Semi-custom", ETO: "ETO (engineer to order)", NONE: "Bid desk (no product)", unmatched: "Not matched yet" }],
  unit: ["Business unit", { BID: "Bid desk" }],
  response: ["Unit response", RESPONSES],
  compliance: ["Unit compliance (any answer)", { ...COMPLIANCE_LABELS, exception: "Exception (earlier value)" }],
  source: ["RFP source check", { verified: "Quote found on the RFP page", not_verified: "Quote not found on the page" }],
  origin: ["Added by", { extraction: "The RFP reader", correction: "A correction", customer_change: "A customer change document" }],
};
const unitsOf = (r) => new Set([...(r.match?.units ?? []).map((u) => u.bu), ...(r.match?.bu ? [r.match.bu] : []), ...r.assignments.map((a) => a.bu)]);
const COMPLIANCE_ORDER = ["not_met", "partial", "deviation", "met"];
function matches(r, f) {
  const req = r.req;
  if (f.category && req.category !== f.category) return false;
  if (f.offering && (r.match?.offering_type ?? "unmatched") !== f.offering) return false;
  if (f.unit && !f.unit.split(",").some((u) => unitsOf(r).has(u))) return false; // ?unit=CROWN,EP2,ANORD: any of them
  if (f.response && !(f.response === "not_sent" ? r.assignments.length === 0 : r.assignments.some((a) => a.status === f.response))) return false;
  if (f.compliance && !r.assignments.some((a) => a.compliance === f.compliance)) return false;
  if (f.source && (req.provenance === "EXTRACTED") !== (f.source === "verified")) return false;
  if (f.origin && (req.origin ?? "extraction") !== f.origin) return false;
  if (f.from && (req.page ?? 0) < Number(f.from)) return false;
  if (f.to && (req.page ?? Infinity) > Number(f.to)) return false;
  if (f.q) { const q = f.q.toLowerCase();
    if (!`${req.req_id} ${req.text} ${req.quote} ${r.children.map((k) => k.text).join(" ")}`.toLowerCase().includes(q)) return false; }
  return true;
}
function sortKey(r, sort) {
  switch (sort) {
    case "id": return r.req.req_id;

    case "unit": return r.match?.bu ?? "~";
    case "compliance": { const ranks = r.assignments.map((a) => COMPLIANCE_ORDER.indexOf(a.compliance ?? "")).filter((i) => i >= 0);
      return ranks.length ? Math.min(...ranks) : COMPLIANCE_ORDER.length; }
    case "changed": return -Date.parse(r.req.created_at ?? "") || 0;
    default: return 0;
  }
}
function applyFilters(rows, f) {
  const kept = rows.filter((r) => matches(r, f));
  const sort = f.sort && f.sort !== "rfp" ? f.sort : "";
  if (!sort) return kept;
  return kept.map((r, i) => ({ r, i, k: sortKey(r, sort) })).sort((a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i)).map((x) => x.r);
}
const isFiltered = (f) => Object.entries(f).some(([k, v]) => v && !(k === "sort" && v === "rfp"));
function valuesOf(r, k) {
  switch (k) {
    case "category": return [r.req.category];
    case "offering": return [r.match?.offering_type ?? "unmatched"];
    case "unit": return [...unitsOf(r)];
    case "response": return r.assignments.length ? [...new Set(r.assignments.map((a) => a.status))] : ["not_sent"];
    case "compliance": return [...new Set(r.assignments.map((a) => a.compliance).filter(Boolean))];
    case "source": return [r.req.provenance === "EXTRACTED" ? "verified" : "not_verified"];
    case "origin": return [r.req.origin ?? "extraction"];

}
function facets(rows, f) {
  const out = {};
  for (const k of FACETS) { const others = { ...f, [k]: undefined }, m = new Map();
    for (const r of rows) if (matches(r, others)) for (const v of valuesOf(r, k)) m.set(v, (m.get(v) ?? 0) + 1);
    out[k] = m; }
  return out;
}

function traceDerived() {
  const data = D.trace, docs = data.docs ?? [];
  const mainId = data.doc?.id ?? docs[0]?.id, shown = docs.find((x) => x.id === T.docId) ?? docs[0], pages = shown?.pages ?? [];
  return { data, docs, mainId, shown, pages, page: pages[T.page - 1], view: applyFilters(data.rows, T.f), filtered: isFiltered(T.f),
    docName: (x) => (!x || x.id === mainId ? "RFP" : x.filename), assessed: data.sent_for_assessment ?? data.rows.some((r) => r.assignments.length > 0) };
}

function selectReq(reqId, { from } = {}) {
  T.sel = reqId;
  const row = D.trace.rows.find((r) => r.req.req_id === reqId);
  if (row && T.linked[1] && row.req.page) { T.docId = row.req.document_id; T.page = row.req.page; }
  T.scrollTo = { req: reqId, panes: [2, 3].filter((p) => T.linked[p] && p !== from) };
  render();
}

function paneFrame(p, body, d) {
  const name = PANE_NAMES[p], at = T.order.indexOf(p), hidden = T.enlarged !== null && T.enlarged !== p, linked = T.linked[p];

  return `<section class="pane" data-pane="${p}" data-keep="pane${p}"${attr("hidden", hidden)}><div class="pane-head">`
    + `<div class="pane-arrange" role="group" aria-label="Arrange pane ${p}: ${name}">`

    + `<button type="button" class="pane-move" ${at >= 2 ? "disabled" : ""} data-act="move" data-arg="${p},1" title="Move right" aria-label="Move pane ${p}: ${name} right"><span aria-hidden="true">▶</span></button></div>`
    + `<h2>${p} · ${name}</h2><div class="pane-tools">`

    + `<button type="button" class="secondary sm" data-act="enlarge" data-arg="${p}" title="${T.enlarged === p ? "Back to the three panes (Esc)" : "Show only this pane"}">${T.enlarged === p ? "Restore" : "Enlarge"}</button>`
    + `<button type="button" class="secondary sm pane-detach" data-demo="Opening a pane in its own window" title="Open this pane in its own window, for example on another screen">New window</button>`
    + `</div></div>${guide("pane" + p)}${body}</section>`;
}

function pane1(d) {
  const { shown, page, pages, docs } = d;
  if (!shown || !page) return '<p class="muted trace-empty">No RFP page available.</p>';
  const boxes = d.data.rows.filter((r) => r.req.page === T.page && r.req.document_id === shown.id).flatMap((r) => r.req.bboxes.map(([x0, y0, x1, y1], i) =>
    `<div class="hl${r.req.req_id === T.sel ? " sel" : ""}" title="${esc(r.req.req_id)}" role="button" tabindex="${i === 0 ? 0 : -1}" aria-label="Select ${esc(r.req.req_id)}" data-hl="${esc(r.req.req_id)}"`
    + ` style="left:${(x0 / page.width) * 100}%;top:${(y0 / page.height) * 100}%;width:${((x1 - x0) / page.width) * 100}%;height:${((y1 - y0) / page.height) * 100}%"></div>`)).join("");

    + (docs.length > 1 ? `<span class="trace-doc-switch" role="group" aria-label="Document shown">${docs.map((x) => `<button type="button" class="chip${x.id === shown.id ? " on" : ""}" aria-pressed="${x.id === shown.id}" title="${esc(x.filename)}" data-act="doc" data-arg="${esc(x.id)}">${esc(d.docName(x))}</button>`).join("")}</span>` : "")
    + `</div><div class="pager"><button aria-label="Previous page" data-act="page" data-arg="-1">◀</button>`

}

const INACTIVE = new Set(["rejected", "split", "merged", "duplicate", "removed", "exception", "dismissed"]);
const OUTSIDE = new Set(["exception", "dismissed"]);
const REG_FILTERS = {
  register: ["In register", (r) => !INACTIVE.has(r.status)], rejected: ["Excluded", (r) => r.status === "rejected"],
  duplicates: ["Duplicates", (r) => r.status === "duplicate"], replaced: ["Ungrouped / split / merged", (r) => r.status === "split" || r.status === "merged"],
  all: ["All", () => true],
};
const kbBadgeOr = (key, link) => { const s = D.bid.knowledge[key];
  return s && s !== "rejected" ? badge(s, { label: KB_STATE[s] ?? s, cls: "kb-sent" }) : link; };
const nominate = '<button type="button" class="link" data-demo="Nominating a reviewed example" title="Nominate as a reviewed example">Nominate as example</button>';

function historyBox(reqId) {
  const h = D.req_history[reqId];
  if (!h) return '<p class="muted">No history recorded.</p>';
  return `<div class="history"><div><h3>Versions (${h.versions.length})</h3><ol class="versions">`
    + h.versions.map((v) => `<li><div class="muted">v${v.n} · ${esc(v.label)}${v.origin ? ` (${esc(originLabel(v.origin))})` : ""} by <strong>${esc(v.by)}</strong> · ${esc(when(v.at))}${v.reason ? ` · reason: ${esc(v.reason)}` : ""}</div><div>${esc(v.text)} <span class="tag">${esc(v.category)}</span></div></li>`).join("")
    + `</ol><p class="quote">Source (${esc(h.source)}): “${esc(h.quote)}”</p>${h.derived_from.length ? `<p class="muted">Created from ${esc(h.derived_from.join(", "))}</p>` : ""}</div>`
    + `<div><h3>Timeline</h3><ul class="timeline">` + h.events.map((e) => `<li><span class="muted">${esc(when(e.at))}</span> <strong>${esc(e.action.replace("_", " "))}</strong> by ${esc(e.by)}`
      + Object.entries(e.details).filter(([, v]) => v !== "" && !(Array.isArray(v) && v.length === 0)).map(([k, v]) => `<span class="muted"> · ${k === "provenance" ? esc(sourceLabel(String(v)).toLowerCase()) : `${esc(k.replace("_", " "))}: ${esc(Array.isArray(v) ? v.join(", ") : String(v))}`}</span>`).join("")
      + "</li>").join("") + "</ul></div></div>";
}

function pane2(d) {
  const R = D.bid.requirements, reg = T.reg, frozen = !!R.baseline;
  const all = R.requirements.filter((r) => !r.parent_id && !OUTSIDE.has(r.status));
  const kidsOf = new Map();
  for (const r of R.requirements) if (r.parent_id) kidsOf.set(r.parent_id, [...(kidsOf.get(r.parent_id) ?? []), r]);
  const activeCount = all.filter(REG_FILTERS.register[1]).length, exc = D.bid.exceptions, latest = D.bid.extraction[0];
  const q = reg.q.toLowerCase(), hit = (r) => `${r.req_id} ${r.text} ${r.quote}`.toLowerCase().includes(q);
  let rows = all.filter((r) => REG_FILTERS[reg.filter][1](r) && (!q || hit(r) || (kidsOf.get(r.req_id) ?? []).some(hit)));
  const order = d.filtered ? d.view.map((r) => r.req.req_id) : null;
  if (order && reg.filter === "register") { const pos = new Map(order.map((id, i) => [id, i])); rows = rows.filter((r) => pos.has(r.req_id)).sort((a, b) => pos.get(a.req_id) - pos.get(b.req_id)); }
  const selectable = rows.filter((r) => !INACTIVE.has(r.status)).map((r) => r.req_id), allSelected = selectable.length > 0 && selectable.every((id) => reg.checked.has(id));

  const line = (r, child = false) => {
    const active = !INACTIVE.has(r.status), kids = kidsOf.get(r.req_id) ?? [], group = r.kind === "group", sel = !child && r.req_id === T.sel;
    const cls = `${active ? "" : "inactive"} ${child ? "child" : ""} ${group ? "group" : ""} ${sel ? "selected" : ""}`.trim();
    let html = `<tr${attr("class", cls || undefined)}${child ? "" : ` data-req="${esc(r.req_id)}" data-from="2" tabindex="0"`}${attr("aria-current", sel && "true")}>`
      + `<td>${active && !child ? `<input type="checkbox" aria-label="Select ${esc(r.req_id)}" data-change="check" data-arg="${esc(r.req_id)}"${attr("checked", reg.checked.has(r.req_id))}>` : ""}</td>`
      + `<td><div class="mono">${esc(r.req_id)}</div><span class="tag">${esc(categoryLabel(r.category))}</span>${r.origin === "correction" || r.origin === "customer_change" ? `<span class="tag origin" title="How this version came in">${esc(originLabel(r.origin))}</span>` : ""}`
      + `<div class="req-source">${r.provenance === "UNANCHORED" ? badge("medium", { kind: "severity", label: sourceLabel(r.provenance), title: "Quote not located on the page; check the source manually" }) : esc(r.source)}</div></td>`
      + `<td><div${attr("class", group && "group-title")}>${esc(r.text)}</div>`
      + (group ? `<button type="button" class="link expand" aria-expanded="${reg.open.has(r.req_id)}" data-act="expand" data-arg="${esc(r.req_id)}">${reg.open.has(r.req_id) ? "▾" : "▸"} ${kids.length} sub-requirements</button>` : `<div class="quote">“${esc(r.quote)}”</div>`)
      + (r.status === "duplicate" ? `<div class="muted">Duplicate of ${esc(r.derived_from.join(", "))}: restore it to keep it anyway</div>` : r.derived_from?.length ? `<div class="muted">From ${esc(r.derived_from.join(", "))}</div>` : "")
      + (sel ? `<span>${kbBadgeOr(`requirement:${r.req_id}`, nominate)}</span>` : "")
      + `<div class="req-meta"><span class="status-cell">${badge(r.status, { label: statusLabel(r.status) })}<button type="button" class="link" aria-expanded="${reg.history === r.req_id}" data-act="history" data-arg="${esc(r.req_id)}">History</button></span>`
      + (active ? `<div class="row-actions">${demoBtn("Exclude: not a requirement", { cls: "secondary", what: "Excluding a requirement" })}${demoBtn("Edit", { cls: "secondary", what: "Editing a requirement" })}${!group && !child ? demoBtn("Split", { cls: "secondary", what: "Splitting a requirement" }) : ""}</div>` : "")
      + "</div></td></tr>";

    if (group && reg.open.has(r.req_id)) html += kids.map((k) => line(k, true)).join("");
    return html;
  };

  const help = frozen ? `Frozen version ${R.baseline.number}, frozen automatically when ${esc(R.baseline.frozen_by)} read the RFP (${R.baseline.count} items). Edits, splits, merges, exclusions and missed requirements are saved as corrections with a reason; customer documents run on the <a href="#/opportunities/${BID}/changes">Changes</a> step.`
    : `${activeCount} requirements in the register; related line items are grouped (expand a group to see its sub-requirements).`;
  let html = `<p class="muted register-help">${help}</p>`
    + `<div class="filters" role="tablist" aria-label="Requirements view"><button role="tab" aria-selected="${reg.tab === "register"}" class="chip ${reg.tab === "register" ? "on" : ""}" data-act="regtab" data-arg="register">Register <span>${activeCount}</span></button>`
    + `<button role="tab" aria-selected="${reg.tab === "exceptions"}" class="chip ${reg.tab === "exceptions" ? "on" : ""}" data-act="regtab" data-arg="exceptions">${TERMS.exception} <span>${R.exceptions ?? exc.length}</span></button></div>`;
  if (R.coverage && Object.keys(R.coverage).length) html += `<details class="muted"><summary>${esc(readSummary(R.coverage, activeCount))}</summary>${latest ? `${snapshotName(latest.number)}: ` : "Latest read: "}`
    + `${esc(Object.entries(R.coverage).filter(([k, v]) => !(k === "problems" && !v)).map(([k, v]) => `${v} ${coverageLabel(k)}`).join(", "))}</details>`;
  if (reg.tab === "exceptions") {
    html += exc.length === 0 ? empty("Nothing needs a source check", "Every proposed requirement has a verified source.") : `<ul class="exceptions">${exc.map((r) => {
      const h = r.location_hint, where = h ? `Probably p. ${h.page}${h.line_start ? `, lines ${h.line_start}-${h.line_end}` : ""} (wording not matched exactly)` : r.suggested_page ? `Suggested page ${r.suggested_page}` : "No page suggested";
      return `<li class="card"><div><span class="mono">${esc(r.req_id)}</span> <span class="tag">${esc(r.category)}</span> ${badge("medium", { kind: "severity", label: "Source not verified" })}</div><div>${esc(r.text)}</div><div class="quote">“${esc(r.quote)}”</div>`
        + `<div class="muted">${esc(where)} · ${esc(r.reason)}</div><div class="row-actions">${demoBtn("Link to lines")}${demoBtn("Dismiss", { cls: "secondary" })}</div></li>`; }).join("")}</ul>`;
  } else if (all.length === 0) {
    html += empty("No requirements yet", "The reader proposes line items here once the main RFP has been read.");
  } else {
    html += `<div class="filters" role="tablist" aria-label="Filter line items">${Object.entries(REG_FILTERS).map(([k, [label, test]]) =>
      `<button role="tab" aria-selected="${reg.filter === k}" class="chip ${reg.filter === k ? "on" : ""}" data-act="regfilter" data-arg="${k}">${label} <span>${all.filter(test).length}</span></button>`).join("")}`
      + `<input type="search" id="regq" placeholder="Search ID or text" value="${esc(reg.q)}" aria-label="Search line items" data-change="regq"></div>`;
    if (order && reg.filter === "register") html += `<p class="muted">Filtered and sorted by the bar above: ${rows.length} of ${activeCount} requirements.</p>`;
    if (reg.checked.size) html += `<div class="bulkbar" role="region" aria-label="Selected line items"><strong>${reg.checked.size} selected</strong>${demoBtn("Merge into one", { cls: "secondary", disabled: reg.checked.size < 2, what: "Merging requirements" })}<button type="button" class="secondary" data-act="uncheck">Clear</button></div>`;
    html += `<table class="req-table"><thead><tr><th class="col-check"><input type="checkbox" aria-label="Select all line items in view" data-change="checkall"${attr("disabled", selectable.length === 0)}${attr("checked", allSelected)}></th><th class="col-id">ID</th><th>Requirement</th></tr></thead><tbody>`
      + rows.map((r) => line(r)).join("") + (rows.length ? "" : `<tr><td colspan="3" class="muted">${reg.q ? `Nothing in “${REG_FILTERS[reg.filter][0]}” matches “${esc(reg.q)}”.` : `No line items under “${REG_FILTERS[reg.filter][0]}”.`}</td></tr>`) + "</tbody></table>";
  }
  if (reg.tab === "register") html += `<details class="card"><summary><strong>Add a requirement the agent missed</strong> <span class="muted">${frozen ? "select its lines on the RFP page; saved as a correction" : "select its lines on the RFP page, or paste the quote"}</span></summary><p class="muted">Demo: selecting lines on the page and saving the correction runs in the live app.</p></details>`;
  const snaps = D.bid.extraction;
  if (snaps.length) html += `<details class="card snapshots"><summary><strong>RFP readings</strong> <span class="muted">${snaps.length} read${snaps.length === 1 ? "" : "s"} of the RFP; each is kept as it was produced</span></summary><ul class="snapshot-list">`
    + snaps.map((s) => { const open = T.reg.snap === s.number, items = D.bid.snapshots[s.number]?.items ?? [];
      return `<li><div><strong class="mono">${snapshotName(s.number)}</strong> · ${esc(s.created_by)} · ${esc(when(s.created_at))}${s.reason ? ` · reason: ${esc(s.reason)}` : ""}</div>`
        + `<div class="muted">${esc([s.model, s.pipeline_version].filter(Boolean).join(" · "))}${s.coverage ? esc(` · ${Object.entries(s.coverage).filter(([k, v]) => !(k === "problems" && !v)).map(([k, v]) => `${v} ${coverageLabel(k)}`).join(", ")}`) : ""}</div>`
        + `<button type="button" class="link" aria-expanded="${open}" data-act="snap" data-arg="${s.number}">${open ? "Hide items" : "View items"}</button>`
        + (open ? `<p class="muted">${snapshotName(s.number)} never changes: this is what the read produced, whatever happened to the register afterwards.</p><table class="req-table"><thead><tr><th>ID</th><th>Page / lines</th><th>Text</th><th>Status</th><th>Group / duplicate of</th></tr></thead><tbody>`
          + items.map((i) => `<tr><td class="mono">${esc(i.req_id)}</td><td>${i.page ? `p. ${i.page}${i.line_start ? `, lines ${i.line_start}-${i.line_end ?? i.line_start}` : ""}` : ""}</td><td>${esc(i.text)}</td><td>${esc(statusLabel(i.status))}</td><td class="mono">${esc(i.duplicate_of ? `duplicate of ${i.duplicate_of}` : i.group ?? "")}</td></tr>`).join("")
          + "</tbody></table>" : "") + "</li>"; }).join("") + "</ul></details>";
  return html;
}

// MatchActions.tsx: how the match came about
const METHOD = { manual: "set by a person", routed: "routed by the bid manager: the unit's designer / engineer confirms the solution", agent: "proposed by the matching agent",
  rule: "routed by rule", retrieval_only: "closest catalog entry (no agent answer)" };
const PRODUCT = ["technical", "compliance"]; // the items a unit's designer / engineer answers
const NEEDS_OWNER = "Needs an owner: no participating unit offers it yet";

function pane3(d) {
  if (d.data.rows.length === 0) return empty("Nothing to map yet", "Proposed solutions and unit responses appear here once requirements exist.");
  const may = new Set(D.can_change[user] ?? []);
  return `<table class="rows"><thead><tr><th class="col-id">ID</th><th>${TERMS.solution}</th><th>Response</th></tr></thead><tbody>` + d.view.map(({ req, match: m, solutions, bom, assignments }) => {
    const sel = req.req_id === T.sel, can = may.has(req.req_id);
    // a non-product item routed to units is answered by their managers; a product item with no unit is a capability gap once the bid desk holds it
    const managers = assignments.some((a) => a.bu !== "BID") ? assignments.filter((a) => a.bu !== "BID").map((a) => a.bu) : PRODUCT.includes(req.category) ? [] : (m?.units ?? []).map((u) => u.bu);
    const noUnit = PRODUCT.includes(req.category) ? (assignments.some((a) => a.bu === "BID") ? TERMS.capability_gap : NEEDS_OWNER) : "Bid desk (not a product item)";
    const solution = m?.bu && PRODUCT.includes(req.category) ? solutions.map((s) => `<div><div class="trace-unit"><span class="muted">${TERMS.solution}:</span> ${esc(solutionLabel(s))}${s.area ? "" : `<span class="muted"> · ${TERMS.solution_pending}</span>`}</div>${s.examples.length ? `<div class="muted trace-product">${esc(examplesLabel(s))}</div>` : ""}</div>`).join("")
      + `<div class="trace-product">${badge(m.offering_type, { kind: "offering" })}</div><div class="muted trace-rationale">${esc(m.rationale)}</div>`
      + (bom.length ? `<details class="trace-bom"><summary>Example bill of materials (${bom.length} ${bom.length === 1 ? "line" : "lines"})</summary><ul>${bom.map((b) => `<li>${esc(b.item)} — ${esc(b.qty)}</li>`).join("")}</ul></details>` : "")
      : `<span class="muted">${m?.status === "rejected" ? "Rejected: choose a unit with Change" : m ? esc(managers.length ? `Not a product item: answered by the unit managers (${managers.join(", ")})` : noUnit) : "Not matched yet"}</span>`;
    const hasSolution = !(m?.units ?? []).some((u) => !u.product_id);
    const actions = `<div class="match-actions">${m ? `<div class="muted match-meta">${m.method !== "rule" && (m.bu || m.status === "rejected") ? badge(m.status) : ""} ${esc(METHOD[m.method] ?? m.method)}</div>` : ""}`
      + (can ? `<div class="row-actions">${m?.status === "proposed" && m.method !== "rule" ? demoBtn("Accept", { disabled: !hasSolution, title: hasSolution ? undefined : "Choose a solution for each unit (Change).", what: "Accepting a match" }) + demoBtn("Reject", { cls: "secondary", what: "Rejecting a match" }) : ""}`
        + demoBtn("Change", { cls: "secondary", what: "Changing a match" }) + "</div>" : "") + "</div>";
    const response = !d.assessed ? '<span class="muted">Responses appear once the bid is sent for assessment</span>'
      : assignments.map((a) => `<div class="trace-assign"><strong>${esc(a.bu)}</strong> ${badge(a.status, { cls: "trace-status" })}${a.compliance ? badge(a.compliance, { kind: "compliance", label: complianceLabel(a.compliance), cls: "trace-compliance" }) : ""}`
        + `${a.response ? `<div class="muted trace-response">${esc(a.response)}</div>` : ""}${a.status === "validated" ? kbBadgeOr(`response:${a.id}`, nominate) : ""}</div>`).join("")
        + (assignments.length ? "" : '<span class="muted">Not sent to units</span>');
    return `<tr data-req="${esc(req.req_id)}" data-from="3" tabindex="0"${attr("class", sel && "selected")}${attr("aria-current", sel && "true")}><td class="mono trace-id">${esc(req.req_id)}</td><td>${solution}${actions}</td><td>${response}</td></tr>`;
  }).join("") + "</tbody></table>";
}
function filterBar(d) {
  const f = T.f, counts = facets(d.data.rows, f);
  const facet = (k) => {
    const [label, names] = FACET_LABELS[k], options = [...counts[k].entries()].sort(([a], [b]) => a.localeCompare(b));
    if (!f[k] && (options.length === 0 || (options.length === 1 && options[0][1] === d.view.length))) return "";
    if (f[k] && !counts[k].has(f[k])) options.push([f[k], f[k].includes(",") ? d.view.length : 0]); // a saved several-unit link
    return `<label>${esc(label)} <select data-change="filter" data-arg="${k}"><option value="">Any</option>${options.map(([v, n]) => `<option value="${esc(v)}"${attr("selected", f[k] === v)}>${esc(names[v] ?? (k === "category" ? categoryLabel(v) : v.split(",").join(", ")))} (${n})</option>`).join("")}</select></label>`;
  };
  return `<div class="filters trace-filters" role="search" aria-label="Filter and sort the requirements">${FACETS.map(facet).join("")}`
    + `<label>Pages <input type="number" min="1" class="narrow" id="ffrom" value="${esc(f.from ?? "")}" aria-label="From page" data-change="filter" data-arg="from"> – <input type="number" min="1" class="narrow" id="fto" value="${esc(f.to ?? "")}" aria-label="To page" data-change="filter" data-arg="to"></label>`
    + `<input type="search" id="fq" placeholder="Search ID or text" value="${esc(f.q ?? "")}" aria-label="Search the requirements" data-change="filter" data-arg="q">`
    + `<label>Sort <select data-change="filter" data-arg="sort"><option value="">RFP order</option>${Object.entries(SORTS).map(([v, l]) => `<option value="${v}"${attr("selected", f.sort === v)}>${l}</option>`).join("")}</select></label>`
    + `<span class="muted">${d.view.length} of ${d.data.rows.length}</span>${d.filtered ? '<button type="button" class="secondary sm" data-act="clearfilters">Clear</button>' : ""}</div>`;
}

function traceScreen() {
  if (!T.sel) { const first = D.trace.rows.find((r) => r.req.page); if (first) { T.sel = first.req.req_id; T.docId = first.req.document_id; T.page = first.req.page; T.scrollTo = { req: T.sel, panes: [2, 3] }; } }
  const d = traceDerived(), bm = isBM(), total = T.order.reduce((s, p) => s + T.widths[p], 0);
  const units = d.assessed ? Object.entries(d.data.progress).map(([bu, p]) => badge(p.validated === p.total ? "validated" : p.submitted > 0 ? "submitted" : "assigned",
    { label: `${bu} ${p.validated}/${p.total} validated`, title: `${p.submitted} of ${p.total} answers submitted` })).join("") : "Not sent for assessment yet";
  const body = { 1: pane1, 2: pane2, 3: pane3 };
  const panes = T.order.map((p, i) => (i > 0 ? `<div class="ws-split" role="separator" aria-orientation="vertical" data-split="${T.order[i - 1]},${p}"${attr("hidden", T.enlarged !== null)} title="Drag to resize." data-label="${Math.round(T.widths[T.order[i - 1]] / total * 100)}% | ${Math.round(T.widths[p] / total * 100)}%"></div>` : "") + paneFrame(p, body[p](d), d)).join("");
  const cols = T.order.map((p) => `minmax(240px, ${T.widths[p]}fr)`).join(" 10px ");
  return pageHead("Requirement Traceability", "Original RFP, the requirement register and the proposed solutions side by side. Select a requirement in any linked pane to follow it across the panes; correct the register in pane 2 (enlarge it to work there). Drag a pane by its grip, or use the arrows, to change the order; drag the bars between panes to resize them; open a pane in a window of its own for another screen.",
    // the bid manager's, until the go/no-go is recorded: then the solutions are the units' answers
    bm && !D.bid.decisions.go_no_go ? demoBtn("Propose solutions", { cls: "secondary", title: "Propose a solution (unit and solution area) for every requirement nobody has decided yet", what: "Proposing solutions" }) : "")
    + guide("trace")
    + `<div class="toolbar"><span class="muted">Unit responses: ${units}</span><button type="button" class="secondary sm" data-act="resetlayout"${attr("disabled", isDefaultLayout())} title="Back to the original order and widths of the panes">Reset layout</button></div>`
    + filterBar(d)
    + `<div class="trace-legend" aria-label="Type of offer legend"><span class="tag CTO"><strong>CTO</strong> Configure-to-order: catalog product with options (CPQ)</span><span class="tag SEMI_CUSTOM"><strong>Semi-custom</strong> Configured product plus workshop work for this customer</span><span class="tag ETO"><strong>ETO</strong> Engineered-to-order: designed for this requirement</span></div>`
    + `<div class="three ws${T.enlarged !== null ? " zoom" : ""}" style="--ws-cols: ${cols}">${panes}</div>`;
}

// ---------- shared bits of the later steps ----------
const BID_DESK = "Bid desk (commercial and submission items)";
const BID_DESK_GAPS = "Bid desk and capability gaps";
const BM_ONLY = "Only the bid manager can do this.";
const day = (iso) => (iso ? String(iso).slice(0, 10) : "");
const show = (iso) => formatDate(day(iso)); // a date shown: "13 Nov 2026"
const traceHref = (id) => `#/opportunities/${BID}/trace#${id}`;
const reqLink = (id) => `<a class="mono" href="${traceHref(esc(id))}" title="Open in Traceability">${esc(id)}</a>`;

const FACTORS = { people: "People", skills: "Skills", capacity: "Manufacturing capacity", materials: "Materials", cost: "Cost" };
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
// ChangeGate.tsx: a step that is done shows its recorded state; the person who may change it gets "Change…" (with Cancel), anyone else sees no form
const GATE = {};
const changeGate = (key, done, canChange, label, form) => !done ? form : !canChange ? ""
  : GATE[key] ? `${form}<div class="row"><button type="button" class="secondary sm" data-act="gate" data-arg="${key}">Cancel</button></div>`
  : `<div class="row"><button type="button" class="secondary sm" data-act="gate" data-arg="${key}">${esc(label)}</button></div>`;

// ScheduleCard.tsx: part "schedule" (Assessment Summary) or "compliance" (Bid decision)
function scheduleCard(part, decided = false) {
  const s = D.bid.schedule, bm = isBM();
  const settled = part === "schedule" && decided && !!s.approvals.schedule?.current && !GATE.schedule;
  const approval = (kind) => {
    const a = s.approvals[kind], accept = kind === "schedule", blocked = accept && !s.ready;
    const line = !a ? `<span class="muted">${accept ? "Not accepted yet." : "Not approved yet."}</span>`
      : !a.current ? `<span class="warn">Reopened: ${accept ? "an estimate or a delivery factor" : "answers"} changed since ${show(a.approved_at)}</span>`
      : `<span>${accept ? "Accepted" : "Approved"} by <strong>${esc(a.approved_by)}</strong> on ${show(a.approved_at)}${a.note ? ` <span class="muted">(${esc(a.note)})</span>` : ""}</span>`;
    return `<div class="row">${bm && !settled ? demoBtn(accept ? "Accept the teams' estimates" : "Approve compliance position", { cls: a?.current ? "secondary sm" : "sm", disabled: blocked }) : ""}${line}`
      + (bm && blocked ? '<span class="muted">Every participating unit must give its estimate and the five delivery factors first</span>' : "")
      + (!bm && !a?.current ? `<span class="muted">${accept ? "Only the bid manager accepts the estimates." : "Only the bid manager approves."}</span>` : "")
      + (bm && settled ? '<button type="button" class="secondary sm" data-act="gate" data-arg="schedule">Change…</button>' : "")
      + (bm && part === "schedule" && GATE.schedule ? '<button type="button" class="secondary sm" data-act="gate" data-arg="schedule">Cancel</button>' : "") + "</div>";
  };
  if (part === "compliance") {
    if (!Object.values(s.compliance).some((c) => Object.entries(c).some(([k, n]) => k !== "open" && n > 0))) return "";
    const lab = (k) => COMPLIANCE_LABELS[k];
    return `<section class="card"><div class="card-head"><h2>Compliance position</h2></div>${guide("compliance_position")}`
      + `<p class="muted">Counted per unit answer: a requirement several units answer counts once for each, and the bid desk row holds the capability gaps (stated as not offered). The bid manager approves the high-level position here; each unit validates its own answers.</p>`
      + `<div class="table-scroll"><table class="dense stack-sm"><thead><tr><th>Unit</th>${["met", "partial", "deviation", "not_met"].map((k) => `<th class="num">${lab(k)}</th>`).join("")}<th class="num">Open</th></tr></thead><tbody>`
      + Object.keys(s.compliance).sort().map((bu) => { const c = s.compliance[bu];
        return `<tr><td><strong>${esc(bu === "BID" ? BID_DESK_GAPS : bu)}</strong></td>${["met", "partial", "deviation", "not_met"].map((k) => `<td class="num" data-label="${lab(k)}">${c[k]}</td>`).join("")}<td class="num" data-label="Open">${c.open}</td></tr>`; }).join("")
      + `</tbody></table></div>${approval("compliance")}</section>`;
  }
  const factor = (u, f) => { const e = u.factors[f];
    return !e ? '<span class="muted">Not stated</span>' : e.status === "ok" ? '<span class="muted">No constraint</span>' : `<span class="tag sev-medium" title="${esc(e.note)}">Constraint</span><div class="muted">${esc(e.note)}</div>`; };
  return `<section class="card"><div class="card-head"><h2>Delivery feasibility from the teams</h2></div>${guide("schedule")}`
    + `<p class="muted">Each unit manager gives the unit's estimate and reports people, skills, manufacturing capacity, materials and cost. Technical feasibility is the designers' / engineers' answers. The bid manager accepts the teams' estimates and does not set the units' dates.</p>`
    + (!bm || settled ? `<p>RFP due date: <strong>${show(s.due_date) || "not set"}</strong> · Consolidation days: <strong>${s.consolidation_days}</strong></p>`
      : `<form class="form" data-demo-form="Saving the schedule settings"><div class="row"><label>RFP due date (from the RFP) <input type="date" name="due_date" value="${day(s.due_date)}"></label>`
        + `<label>Consolidation days <input type="number" name="consolidation_days" class="narrow" min="0" step="1" value="${s.consolidation_days}"></label><button class="secondary sm">Save</button></div></form>`)
    + "<h3>Estimates and delivery factors per unit</h3>"
    + (s.units.length === 0 ? '<p class="muted">No unit takes part yet: record participation first.</p>'
      : `<div class="table-scroll"><table class="dense feasibility"><thead><tr><th>Unit</th><th>Estimate</th>${Object.values(FACTORS).map((l) => `<th>${l}</th>`).join("")}<th>Entered by</th></tr></thead><tbody>`
        + s.units.map((u) => `<tr><td data-label="Unit">${esc(u.bu)}</td><td data-label="Estimate">${u.estimated_completion ? `${show(u.estimated_completion)}${u.note ? `<div class="muted">${esc(u.note)}</div>` : ""}` : '<span class="tag">Waiting for the unit manager</span>'}</td>`
          + Object.keys(FACTORS).map((f) => `<td data-label="${FACTORS[f]}">${factor(u, f)}</td>`).join("") + `<td data-label="Entered by">${esc(u.entered_by || "—")}</td></tr>`).join("") + "</tbody></table></div>")
    + (s.units.length ? (s.constraints.length === 0 ? '<p class="muted">No team reports a constraint.</p>'
      : `<p>Constraints reported: <strong>${s.constraints.length}</strong></p><ul>${s.constraints.map((c) => `<li>${esc(c.bu)} · ${FACTORS[c.factor]}: ${esc(c.note)}</li>`).join("")}</ul>`) : "")
    + `<p>${s.planned_submission ? `Latest estimate ${show(s.latest_unit_date)}; planned submission <strong>${show(s.planned_submission)}</strong> (+ ${s.consolidation_days} days to consolidate)`
      : `Planned submission: when every unit has given its estimate (waiting: ${esc(s.missing.join(", ") || "none")})`}</p>`
    + (s.after_due ? alertBox("warn", `The planned submission ${show(s.planned_submission)} is later than the RFP due date ${show(s.due_date)}.`, "After the due date") : "")
    + approval("schedule") + "</section>";
}

    + (hasRun || !decided ? `<form class="form" data-demo-form="Reassessing"><div class="row"><label><span class="sr-only">Reason for the assessment</span><input name="reason" placeholder="${hasRun ? "Why reassess?" : "Why assess now?"}"${attr("disabled", !bm)}></label>`
      + `<button class="${hasRun ? "secondary sm" : "sm"}"${attr("disabled", !bm)}${attr("title", !bm && BM_ONLY)}>${hasRun ? "Reassess" : "Assess with the knowledge base"}</button>${!bm ? `<span class="muted">${BM_ONLY}</span>` : ""}</div></form>` : "")

function assessmentScreen() {

function detail(e) {

  switch (`${e.entity}.${e.action}`) {
    case "assignment.responded": add("Compliance", d.compliance ? complianceLabel(String(d.compliance)) : ""); add(TERMS.solution, d.product_ref); add("Answer", d.response); break;
    case "assignment.assigned": add("Owner", d.owner); break;
    case "assignment.withdrawn": add("Was", d.was); add("Because", d.reason); break;
    case "assignment.returned": case "assignment.validated": add("Note", d.note); break;
    case "opportunity.status": add("", `${asText(d.before)} → ${asText(d.after)}`); break;
    case "opportunity.created": add("Title", d.title); break;
    case "baseline.frozen": add("Requirements", d.count); break;
    case "match.proposed": case "match.manual": case "match.routed":
      if (Array.isArray(d.units)) add("", d.units.map((u) => [u.bu, u.product_id].filter(Boolean).join(" · ")).filter(Boolean).join("; "));
      add("Method", d.method); break;
    case "participation.decided": case "go_no_go.decided": add("Units", Array.isArray(d.units) ? d.units.join(", ") : d.units); add("Reason", d.rationale); break;
    case "document.uploaded": add("File", d.filename); add("Type", d.role); break;
    default: add("", d.note); add("Reason", d.reason); add("", d.text);
  }
  return parts.length ? parts.join(" · ") : null;
}

// ---------- Compliance matrix (consolidation/page.tsx + _components) ----------
const NO_FILTER = { q: "", unit: "", compliance: "", state: "", category: "", onlyOpen: false };

const rowKey = (r) => `${r.req_id}:${r.assignment_id ?? "none"}`;
const REASONS = [["validation", "Waiting for validation"], ["unit", "Waiting for the unit"], ["returned", "Returned"], ["unassigned", "Not assigned"]];
function reasonOf(rows) {
  const { state, assignments } = rows[0];
  if (state === "answered") return null;
  if (assignments === 0) return "unassigned";
  const st = rows.map((r) => r.status);
  return st.includes("returned") ? "returned" : st.includes("assigned") ? "unit" : "validation";
}
const complianceBadge = (r) => { if (!r.compliance) return "";

  return ["partial", "deviation", "not_met"].includes(r.compliance) ? `<span class="reason-tip" tabindex="0">${b}<span role="tooltip" class="reason-pop">${esc(r.reason ?? "Reason not provided")}</span></span>` : b; };
const sentence = (v) => pretty(v);
function historyList(id, unit) {
  const evs = D.asg_history[id] ?? [];

  return `<ol class="resp-history-list" aria-label="History of the ${esc(unit ?? "unit")} answer, oldest first">` + evs.map((ev) => `<li><div><strong>${esc(ev.actor)}</strong> ${what({ entity: "assignment", action: ev.action })} <span class="muted">· ${esc(when(ev.at))}</span></div>`

    + Object.keys(CHANGE_LABELS).filter((k) => k in ev.after).map((k) => `<div class="muted">${CHANGE_LABELS[k]}: ${esc(changeValue(k, ev.before[k] ?? null))} → ${esc(changeValue(k, ev.after[k] ?? null))}</div>`).join("") + "</li>").join("") + "</ol>";

function pageView(docId, pageNo, boxes, label) {

function sourcePreview(row, docName) {

    let p = pages.find((x) => x.docId === s.document_id && x.page === s.page);
    if (!p) pages.push((p = { docId: s.document_id, page: s.page, boxes: [], spans: [] }));
    p.boxes.push(...s.bboxes); if (s.line_start) p.spans.push([s.line_start, s.line_end ?? s.line_start]); }
  if (!pages.length) return `<p class="preview-empty">No source location is stored for this requirement, so there is no page to show and nothing to highlight. <a href="${traceHref(esc(row.req_id))}">Open in Traceability</a></p>`;
  const p = pages[Math.min(C.srcPage ?? 0, pages.length - 1)], merged = [];
  for (const [a, b] of [...p.spans].sort((x, y) => x[0] - y[0])) { const last = merged[merged.length - 1]; if (last && a <= last[1] + 1) last[1] = Math.max(last[1], b); else merged.push([a, b]); }
  const ranges = merged.map(([a, b]) => (a === b ? `${a}` : `${a}-${b}`));

  return `<div class="preview"><p class="preview-ref"><strong>${esc(docName)}, page ${p.page}${lines}</strong></p>`
    + (pages.length > 1 ? `<div class="preview-pages" role="group" aria-label="Pages of this source">${pages.map((x, i) => `<button type="button" class="chip" aria-pressed="${x === p}" data-act="srcpage" data-arg="${i}">Page ${x.page}</button>`).join("")}</div>` : "")
    + pageView(p.docId, p.page, p.boxes, `${docName}, page ${p.page}`) + `<p><a href="${traceHref(esc(row.req_id))}">Open in Traceability</a></p></div>`;
}

function consolidationScreen() {

  const reasons = new Map([...byReq].map(([k, v]) => [k, reasonOf(v)]));

  const cats = [...new Set(rows.map((r) => r.category))].sort(), unassigned = rows.some((r) => !r.unit), unanswered = rows.some((r) => r.unit && !r.compliance);
